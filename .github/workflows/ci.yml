name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy jádra (bez závislostí)
        run: npm test
      - name: Instalace Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prohlížečové testy
        env:
          PLAYWRIGHT_CHROMIUM: ""
        run: npm run test:browser
